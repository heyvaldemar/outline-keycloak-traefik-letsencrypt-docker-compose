# Image pins live HERE, as interpolation defaults, so `git pull` (or
# re-downloading this file) delivers the exact version combination this
# repository has tested — no .env editing required. Setting the matching
# variable in .env overrides the default for anyone who wants to pin
# differently; .env itself carries only secrets and deliberate overrides.
# CI (Trivy scans, check-pin-freshness, the ephemeral test .env) reads
# the pins from these lines — this block is the single source of truth.
x-images:
  outline-postgres: &outline-postgres-image ${OUTLINE_POSTGRES_IMAGE_TAG:-postgres:${OUTLINE_POSTGRES_IMAGE_VERSION:-16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94}}
  outline: &outline-image ${OUTLINE_IMAGE_TAG:-outlinewiki/outline:${OUTLINE_IMAGE_VERSION:-1.10.1@sha256:832051f039b446c87aa23929cf92c00980c66aaa2d744d118c48c016ec816ad8}}
  redis: &redis-image ${OUTLINE_REDIS_IMAGE_TAG:-redis:${OUTLINE_REDIS_IMAGE_VERSION:-7.4@sha256:71da9275c5f3fcb97d0fa0c8c5b36cc995327265420f17a04bfd544f458059f7}}
  garage: &garage-image ${OUTLINE_GARAGE_IMAGE_TAG:-dxflrs/garage:${OUTLINE_GARAGE_IMAGE_VERSION:-v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020}}
  backups: &backups-image ${OUTLINE_BACKUPS_IMAGE_TAG:-alpine:${OUTLINE_BACKUPS_IMAGE_VERSION:-3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce}}

networks:
  outline-network:
    external: true
  keycloak-network:
    external: true
  traefik-network:
    external: true

volumes:
  # MinIO's volume is deliberately still declared. An upgrade from 1.x leaves
  # the old objects in it, and the migration script reads them from here; a
  # compose file that dropped the name would leave that data addressable only
  # by a docker volume id somebody has to go and find. Remove it once the
  # migration is done and verified.
  minio-data:
  garage-meta:
  garage-data:
  outline-postgres:
  outline-postgres-backup:
  outline-data-backups:
  outline-database-backups:

services:
  postgres-outline:
    image: *outline-postgres-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's
    # entrypoint needs (bind :80/:443, chown its data directory, drop to
    # its service user).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID
    # Resource limits as .env-overridable defaults (e.g. OUTLINE_KEYCLOAK_POSTGRES_OUTLINE_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${OUTLINE_KEYCLOAK_POSTGRES_OUTLINE_MEMORY_LIMIT:-1g}
          cpus: "${OUTLINE_KEYCLOAK_POSTGRES_OUTLINE_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${OUTLINE_KEYCLOAK_POSTGRES_OUTLINE_MEMORY_RESERVATION:-128m}
          cpus: "${OUTLINE_KEYCLOAK_POSTGRES_OUTLINE_CPU_RESERVATION:-0.25}"
    volumes:
      - outline-postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${OUTLINE_DB_NAME:-outlinedb}
      POSTGRES_USER: ${OUTLINE_DB_USER:-outlinedbuser}
      POSTGRES_PASSWORD: ${OUTLINE_DB_PASSWORD:?set in .env - see .env.example for generation command}
    networks:
      - outline-network
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "${OUTLINE_DB_NAME:-outlinedb}", "-U", "${OUTLINE_DB_USER:-outlinedbuser}" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  redis:
    image: *redis-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's
    # entrypoint needs (bind :80/:443, chown its data directory, drop to
    # its service user).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    # Resource limits as .env-overridable defaults (e.g. OUTLINE_KEYCLOAK_REDIS_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${OUTLINE_KEYCLOAK_REDIS_MEMORY_LIMIT:-256m}
          cpus: "${OUTLINE_KEYCLOAK_REDIS_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${OUTLINE_KEYCLOAK_REDIS_MEMORY_RESERVATION:-32m}
          cpus: "${OUTLINE_KEYCLOAK_REDIS_CPU_RESERVATION:-0.1}"
    networks:
      - outline-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Object storage for attachments. Garage, not MinIO — see garage/garage.toml
  # for why, and for the list of S3 operations that were exercised against it
  # before the swap.
  garage:
    image: *garage-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # A single static binary serving HTTP and writing files. No Linux
    # capability is needed for either.
    cap_drop:
      - ALL
    # Garage keeps its metadata in SQLite. A kill during a write leaves it to
    # be recovered on the next start.
    stop_grace_period: ${OUTLINE_GARAGE_STOP_GRACE_PERIOD:-60s}
    # Resource limits as .env-overridable defaults (e.g. OUTLINE_KEYCLOAK_GARAGE_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${OUTLINE_KEYCLOAK_GARAGE_MEMORY_LIMIT:-1g}
          cpus: "${OUTLINE_KEYCLOAK_GARAGE_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${OUTLINE_KEYCLOAK_GARAGE_MEMORY_RESERVATION:-128m}
          cpus: "${OUTLINE_KEYCLOAK_GARAGE_CPU_RESERVATION:-0.25}"
    environment:
      # Both read from the environment rather than written into garage.toml, so
      # the secrets live in .env with everything else.
      GARAGE_RPC_SECRET: ${OUTLINE_GARAGE_RPC_SECRET:?set in .env - see .env.example for generation command}
      GARAGE_ADMIN_TOKEN: ${OUTLINE_GARAGE_ADMIN_TOKEN:?set in .env - see .env.example for generation command}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    networks:
      - outline-network
      - traefik-network
    healthcheck:
      # The binary's own subcommand. There is no shell in this image to wrap it
      # in, which is also why the bootstrap below talks to the admin API
      # instead of running a script here.
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # Match incoming requests on a specific hostname
      - "traefik.http.routers.garage-s3.rule=Host(`${OUTLINE_S3_HOSTNAME:?set in .env - see .env.example}`)"
      # Assign the router to a named Traefik service
      - "traefik.http.routers.garage-s3.service=garage-s3"
      # Use the 'websecure' (HTTPS) entry point
      - "traefik.http.routers.garage-s3.entrypoints=websecure"
      # Define the internal container port for routing
      - "traefik.http.services.garage-s3.loadbalancer.server.port=3900"
      # Enable TLS on this router
      - "traefik.http.routers.garage-s3.tls=true"
      # Use Let's Encrypt for certificate management
      - "traefik.http.routers.garage-s3.tls.certresolver=letsencrypt"
      # Pass the original Host header to the container. This one is not
      # optional: an S3 SigV4 signature covers the Host header, so a proxy that
      # rewrote it would invalidate every presigned URL Outline hands out.
      - "traefik.http.services.garage-s3.loadbalancer.passhostheader=true"
      # Specify which Docker network Traefik should use for routing
      - "traefik.docker.network=traefik-network"
      # DELIBERATELY NO COMPRESSION on this router. Attachments are already
      # compressed formats, and gzipping a response whose bytes a client is
      # about to checksum is a way to spend CPU making files marginally larger.
    restart: unless-stopped

  # Creates the storage layout, the access key and the bucket, then exits.
  #
  # It talks to Garage's admin API over HTTP rather than running the `garage`
  # binary, and that is forced rather than preferred: the Garage image is built
  # FROM scratch and contains nothing but that binary — no /bin/sh — so an init
  # container with a script in it cannot start at all. The admin API needs no
  # shell on the other side.
  #
  # It is idempotent. On a stack that is already set up it changes nothing and
  # says what it found, which is what makes it safe to leave in the dependency
  # chain of every `up -d`.
  garage-init:
    image: *backups-image
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: ${OUTLINE_GARAGE_INIT_MEMORY_LIMIT:-64m}
          cpus: "${OUTLINE_GARAGE_INIT_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${OUTLINE_GARAGE_INIT_MEMORY_RESERVATION:-8m}
          cpus: "${OUTLINE_GARAGE_INIT_CPU_RESERVATION:-0.1}"
    entrypoint: ["/bin/sh", "/garage-init.sh"]
    environment:
      GARAGE_HOST: garage
      GARAGE_ADMIN_TOKEN: ${OUTLINE_GARAGE_ADMIN_TOKEN:?set in .env - see .env.example for generation command}
      GARAGE_ZONE: ${OUTLINE_GARAGE_ZONE:-default}
      GARAGE_CAPACITY: ${OUTLINE_GARAGE_CAPACITY:-100000000000}
      S3_ACCESS_KEY: ${OUTLINE_S3_ACCESS_KEY:?set in .env - see .env.example for generation command}
      S3_SECRET_KEY: ${OUTLINE_S3_SECRET_KEY:?set in .env - see .env.example for generation command}
      S3_KEY_NAME: ${OUTLINE_S3_KEY_NAME:-outline}
      S3_BUCKET: ${OUTLINE_S3_BUCKET_NAME:-data}
    volumes:
      - ./garage/garage-init.sh:/garage-init.sh:ro
    networks:
      - outline-network
    restart: "no"
    depends_on:
      garage:
        condition: service_healthy

  outline:
    image: *outline-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Resource limits as .env-overridable defaults (e.g. OUTLINE_KEYCLOAK_OUTLINE_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${OUTLINE_KEYCLOAK_OUTLINE_MEMORY_LIMIT:-1g}
          cpus: "${OUTLINE_KEYCLOAK_OUTLINE_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${OUTLINE_KEYCLOAK_OUTLINE_MEMORY_RESERVATION:-128m}
          cpus: "${OUTLINE_KEYCLOAK_OUTLINE_CPU_RESERVATION:-0.25}"
    environment:
      DATABASE_URL: postgres://${OUTLINE_DB_USER:-outlinedbuser}:${OUTLINE_DB_PASSWORD}@postgres-outline:5432/${OUTLINE_DB_NAME:-outlinedb}?sslmode=disable&connect_timeout=10
      PGSSLMODE: disable
      REDIS_URL: redis://redis:6379
      URL: ${OUTLINE_URL:?set in .env - see .env.example}
      PORT: 3000
      SECRET_KEY: ${OUTLINE_SECRET_KEY:?set in .env - see .env.example for generation command}
      UTILS_SECRET: ${OUTLINE_UTILS_SECRET:?set in .env - see .env.example for generation command}
      FORCE_HTTPS: 'false'
      ENABLE_UPDATES: 'true'
      # Set explicitly, because the alternative is relying on a default that
      # upstream's own .env.sample contradicts. The image's compiled default
      # when FILE_STORAGE is unset is "s3", while the sample file shows
      # FILE_STORAGE=local - so the template was right and looked wrong, and a
      # future change to that default would move every attachment to a
      # directory inside the container without saying anything.
      FILE_STORAGE: s3
      # Garage's own region name. It is not an AWS region and never reaches
      # AWS; it is part of the SigV4 string to sign, so it has to match what
      # garage.toml declares.
      AWS_REGION: garage
      AWS_ACCESS_KEY_ID: ${OUTLINE_S3_ACCESS_KEY:?set in .env - see .env.example for generation command}
      AWS_SECRET_ACCESS_KEY: ${OUTLINE_S3_SECRET_KEY:?set in .env - see .env.example for generation command}
      AWS_S3_UPLOAD_BUCKET_URL: https://${OUTLINE_S3_HOSTNAME:?set in .env - see .env.example}
      AWS_S3_ACCELERATE_URL: https://${OUTLINE_S3_HOSTNAME:?set in .env - see .env.example}
      AWS_S3_UPLOAD_BUCKET_NAME: ${OUTLINE_S3_BUCKET_NAME:-data}
      # Renamed upstream. AWS_S3_UPLOAD_MAX_SIZE still works and logs a
      # deprecation on every start; the .env key is unchanged so nobody has to
      # edit a file to stop seeing it.
      FILE_STORAGE_UPLOAD_MAX_SIZE: ${OUTLINE_AWS_S3_UPLOAD_MAX_SIZE}
      # PATH STYLE, and this changed with the storage. Virtual-hosted style
      # puts the bucket in a subdomain - data.s3.example.com - which behind one
      # Traefik hostname needs a wildcard certificate and a wildcard DNS
      # record. Path style keeps everything on the single hostname the
      # certificate already covers.
      AWS_S3_FORCE_PATH_STYLE: 'true'
      AWS_S3_ACL: private
      OIDC_CLIENT_ID: outline
      OIDC_CLIENT_SECRET: ${OUTLINE_OIDC_CLIENT_SECRET:?set in .env - see .env.example}
      OIDC_AUTH_URI: ${OUTLINE_OIDC_AUTH_URI}
      OIDC_TOKEN_URI: ${OUTLINE_OIDC_TOKEN_URI}
      OIDC_USERINFO_URI: ${OUTLINE_OIDC_USERINFO_URI}
      OIDC_DISPLAY_NAME: ${OUTLINE_OIDC_DISPLAY_NAME:-Keycloak}
      OIDC_USERNAME_CLAIM: ${OUTLINE_OIDC_USERNAME_CLAIM:-email}
      OIDC_SCOPES: ${OUTLINE_OIDC_SCOPES:-openid profile email}
    networks:
      - outline-network
      - keycloak-network
      - traefik-network
    healthcheck:
      test: timeout 10s bash -c ':> /dev/tcp/127.0.0.1/3000' || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # Match incoming requests on a specific hostname
      - "traefik.http.routers.outline.rule=Host(`${OUTLINE_HOSTNAME:?set in .env - see .env.example}`)"
      # Assign the router to a named Traefik service
      - "traefik.http.routers.outline.service=outline"
      # Use the 'websecure' (HTTPS) entry point
      - "traefik.http.routers.outline.entrypoints=websecure"
      # Define the internal container port for routing
      - "traefik.http.services.outline.loadbalancer.server.port=3000"
      # Enable TLS on this router
      - "traefik.http.routers.outline.tls=true"
      # Use Let's Encrypt for certificate management
      - "traefik.http.routers.outline.tls.certresolver=letsencrypt"
      # Pass the original Host header to the container
      - "traefik.http.services.outline.loadbalancer.passhostheader=true"
      # Apply a compression middleware
      - "traefik.http.routers.outline.middlewares=compresstraefik"
      # Define settings for the compression middleware
      - "traefik.http.middlewares.compresstraefik.compress=true"
      # Specify which Docker network Traefik should use for routing
      - "traefik.docker.network=traefik-network"
    restart: unless-stopped
    depends_on:
      postgres-outline:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully

  backups-outline:
    image: *outline-postgres-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's
    # entrypoint needs (bind :80/:443, chown its data directory, drop to
    # its service user).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    # Resource limits as .env-overridable defaults (e.g. OUTLINE_KEYCLOAK_BACKUPS_OUTLINE_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${OUTLINE_KEYCLOAK_BACKUPS_OUTLINE_MEMORY_LIMIT:-256m}
          cpus: "${OUTLINE_KEYCLOAK_BACKUPS_OUTLINE_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${OUTLINE_KEYCLOAK_BACKUPS_OUTLINE_MEMORY_RESERVATION:-32m}
          cpus: "${OUTLINE_KEYCLOAK_BACKUPS_OUTLINE_CPU_RESERVATION:-0.1}"
    command: >-
      bash -c 'set -o pipefail;
      sleep "$$OUTLINE_BACKUP_INIT_SLEEP";
      while true; do
        STAMP="$$(date +%Y-%m-%d_%H-%M)";
        DB_FILE="$$OUTLINE_POSTGRES_BACKUPS_PATH/$$OUTLINE_POSTGRES_BACKUP_NAME-$$STAMP.gz";
        echo "[$$(date -Iseconds)] Starting database backup to $$DB_FILE";
        if pg_dump -h postgres-outline -p 5432 -d $$OUTLINE_DB_NAME -U $$OUTLINE_DB_USER | gzip > "$$DB_FILE"; then
          echo "[$$(date -Iseconds)] Database backup OK: $$DB_FILE ($$(stat -c %s "$$DB_FILE") bytes)";
        else
          echo "[$$(date -Iseconds)] Database backup FAILED - partial file kept as $$DB_FILE.failed for diagnosis" >&2;
          mv "$$DB_FILE" "$$DB_FILE.failed" 2>/dev/null || true;
        fi;
        DATA_FILE="$$OUTLINE_DATA_BACKUPS_PATH/$$OUTLINE_DATA_BACKUP_NAME-$$STAMP.tar.gz";
        echo "[$$(date -Iseconds)] Starting data backup to $$DATA_FILE";
        # GNU tar exits 1 when a live application changed a file mid-read;
        # the archive is complete - only exit 2 is a real failure. No GNU-only
        # flags: alpine images ship BusyBox tar.
        tar -zcpf "$$DATA_FILE" $$OUTLINE_DATA_PATH; RC=$$?;
        if [ "$$RC" -eq 0 ] || [ "$$RC" -eq 1 ]; then
          echo "[$$(date -Iseconds)] Data backup OK: $$DATA_FILE ($$(stat -c %s "$$DATA_FILE") bytes)$$([ "$$RC" -eq 1 ] && echo " - some files changed while being read")";
        else
          echo "[$$(date -Iseconds)] Data backup FAILED - partial file kept as $$DATA_FILE.failed for diagnosis" >&2;
          mv "$$DATA_FILE" "$$DATA_FILE.failed" 2>/dev/null || true;
        fi;
        if [ "$${OUTLINE_POSTGRES_BACKUP_PRUNE_DAYS:-0}" -ge 1 ]; then
          find "$$OUTLINE_POSTGRES_BACKUPS_PATH" -type f -name "$$OUTLINE_POSTGRES_BACKUP_NAME-*" -mtime "+$$OUTLINE_POSTGRES_BACKUP_PRUNE_DAYS" -delete;
        fi;
        if [ "$${OUTLINE_DATA_BACKUP_PRUNE_DAYS:-0}" -ge 1 ]; then
          find "$$OUTLINE_DATA_BACKUPS_PATH" -type f -name "$$OUTLINE_DATA_BACKUP_NAME-*" -mtime "+$$OUTLINE_DATA_BACKUP_PRUNE_DAYS" -delete;
        fi;
        sleep "$$OUTLINE_BACKUP_INTERVAL";
      done'
    volumes:
      - outline-postgres-backup:/var/lib/postgresql/data
      - minio-data:${OUTLINE_DATA_PATH:-/data}
      - outline-data-backups:${OUTLINE_DATA_BACKUPS_PATH:-/srv/outline-application-data/backups}
      - outline-database-backups:${OUTLINE_POSTGRES_BACKUPS_PATH:-/srv/outline-postgres/backups}
    environment:
      OUTLINE_DB_NAME: ${OUTLINE_DB_NAME:-outlinedb}
      OUTLINE_DB_USER: ${OUTLINE_DB_USER:-outlinedbuser}
      PGPASSWORD: ${OUTLINE_DB_PASSWORD}
      OUTLINE_BACKUP_INIT_SLEEP: ${OUTLINE_BACKUP_INIT_SLEEP:-30m}
      OUTLINE_BACKUP_INTERVAL: ${OUTLINE_BACKUP_INTERVAL:-24h}
      OUTLINE_POSTGRES_BACKUP_PRUNE_DAYS: ${OUTLINE_POSTGRES_BACKUP_PRUNE_DAYS:-7}
      OUTLINE_DATA_BACKUP_PRUNE_DAYS: ${OUTLINE_DATA_BACKUP_PRUNE_DAYS:-7}
      OUTLINE_POSTGRES_BACKUPS_PATH: ${OUTLINE_POSTGRES_BACKUPS_PATH:-/srv/outline-postgres/backups}
      OUTLINE_DATA_BACKUPS_PATH: ${OUTLINE_DATA_BACKUPS_PATH:-/srv/outline-application-data/backups}
      OUTLINE_DATA_PATH: ${OUTLINE_DATA_PATH:-/data}
      OUTLINE_POSTGRES_BACKUP_NAME: ${OUTLINE_POSTGRES_BACKUP_NAME:-outline-postgres-backup}
      OUTLINE_DATA_BACKUP_NAME: ${OUTLINE_DATA_BACKUP_NAME:-outline-minio-application-data-backup}
    networks:
      - outline-network
    restart: unless-stopped
    depends_on:
      postgres-outline:
        condition: service_healthy
