# Image pins live HERE, as interpolation defaults, so `git pull` (or
# re-downloading this file) delivers the exact version combination this
# repository has tested — no .env editing required. Setting the matching
# variable in .env overrides the default for anyone who wants to pin
# differently; .env itself carries only secrets and deliberate overrides.
# CI (Trivy scans, check-pin-freshness, the ephemeral test .env) reads
# the pins from these lines — this block is the single source of truth.
x-images:
  outline-postgres: &outline-postgres-image ${OUTLINE_POSTGRES_IMAGE_TAG:-postgres:${OUTLINE_POSTGRES_IMAGE_VERSION:-16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94}}
  outline: &outline-image ${OUTLINE_IMAGE_TAG:-outlinewiki/outline:${OUTLINE_IMAGE_VERSION:-1.9.2@sha256:32d76719c378931dd65d93945930ca380d8376a0337d98a991fcc12b266f33cf}}
  redis: &redis-image ${OUTLINE_REDIS_IMAGE_TAG:-redis:${OUTLINE_REDIS_IMAGE_VERSION:-7.4@sha256:71da9275c5f3fcb97d0fa0c8c5b36cc995327265420f17a04bfd544f458059f7}}
  minio: &minio-image ${OUTLINE_MINIO_IMAGE_TAG:-minio/minio:${OUTLINE_MINIO_IMAGE_VERSION:-RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e}}

networks:
  outline-network:
    external: true
  keycloak-network:
    external: true
  traefik-network:
    external: true

volumes:
  minio-data:
  outline-postgres:
  outline-postgres-backup:
  outline-data-backups:
  outline-database-backups:

services:
  postgres-outline:
    image: *outline-postgres-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's
    # entrypoint needs (bind :80/:443, chown its data directory, drop to
    # its service user).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID
    # Resource limits as .env-overridable defaults (e.g. OUTLINE_KEYCLOAK_POSTGRES_OUTLINE_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${OUTLINE_KEYCLOAK_POSTGRES_OUTLINE_MEMORY_LIMIT:-1g}
          cpus: "${OUTLINE_KEYCLOAK_POSTGRES_OUTLINE_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${OUTLINE_KEYCLOAK_POSTGRES_OUTLINE_MEMORY_RESERVATION:-128m}
          cpus: "${OUTLINE_KEYCLOAK_POSTGRES_OUTLINE_CPU_RESERVATION:-0.25}"
    volumes:
      - outline-postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${OUTLINE_DB_NAME:-outlinedb}
      POSTGRES_USER: ${OUTLINE_DB_USER:-outlinedbuser}
      POSTGRES_PASSWORD: ${OUTLINE_DB_PASSWORD:?set in .env - see .env.example for generation command}
    networks:
      - outline-network
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "${OUTLINE_DB_NAME:-outlinedb}", "-U", "${OUTLINE_DB_USER:-outlinedbuser}" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  redis:
    image: *redis-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's
    # entrypoint needs (bind :80/:443, chown its data directory, drop to
    # its service user).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    # Resource limits as .env-overridable defaults (e.g. OUTLINE_KEYCLOAK_REDIS_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${OUTLINE_KEYCLOAK_REDIS_MEMORY_LIMIT:-256m}
          cpus: "${OUTLINE_KEYCLOAK_REDIS_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${OUTLINE_KEYCLOAK_REDIS_MEMORY_RESERVATION:-32m}
          cpus: "${OUTLINE_KEYCLOAK_REDIS_CPU_RESERVATION:-0.1}"
    networks:
      - outline-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  minio:
    image: *minio-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Resource limits as .env-overridable defaults (e.g. OUTLINE_KEYCLOAK_MINIO_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${OUTLINE_KEYCLOAK_MINIO_MEMORY_LIMIT:-1g}
          cpus: "${OUTLINE_KEYCLOAK_MINIO_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${OUTLINE_KEYCLOAK_MINIO_MEMORY_RESERVATION:-128m}
          cpus: "${OUTLINE_KEYCLOAK_MINIO_CPU_RESERVATION:-0.25}"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        minio server /data --console-address :9001 &
        sleep 20
        mc config host add minio http://localhost:9000 ${OUTLINE_MINIO_ADMIN:-minioadmin} ${OUTLINE_MINIO_ADMIN_PASSWORD:?set in .env - see .env.example for generation command}
        mc mb minio/${OUTLINE_MINIO_BUCKET_NAME:-data}
        mc admin user add minio ${OUTLINE_MINIO_USER:-bucket.data} ${OUTLINE_MINIO_USER_PASSWORD:?set in .env - see .env.example for generation command}
        cat > outline-policy.json <<-EOF
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "s3:GetBucketLocation",
                  "s3:ListBucket",
                  "s3:ListBucketMultipartUploads"
                ],
                "Resource": [
                  "arn:aws:s3:::${OUTLINE_MINIO_BUCKET_NAME:-data}"
                ]
              },
              {
                "Action": [
                  "s3:AbortMultipartUpload",
                  "s3:DeleteObject",
                  "s3:GetObject",
                  "s3:ListMultipartUploadParts",
                  "s3:PutObject",
                  "s3:GetObject"
                ],
                "Effect": "Allow",
                "Resource": [
                  "arn:aws:s3:::${OUTLINE_MINIO_BUCKET_NAME:-data}/*"
                ],
                "Sid": ""
              }
            ]
          }
        EOF
        cat > data-public.json <<-EOF
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": {
                "AWS": [
                  "*"
                ]
              },
                "Action": [
                  "s3:GetObject",
                  "s3:ListMultipartUploadParts"
                ],
                "Resource": [
                  "arn:aws:s3:::data/public/*"
                ]
              }
            ]
          }
        EOF
        mc anonymous set-json data-public.json minio/${OUTLINE_MINIO_BUCKET_NAME:-data}
        mc admin policy create minio OutlineAppFullAccess outline-policy.json
        mc admin policy attach minio OutlineAppFullAccess --user=${OUTLINE_MINIO_USER:-bucket.data}
        tail -f /dev/null
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: ${OUTLINE_MINIO_ADMIN:-minioadmin}
      MINIO_ROOT_PASSWORD: ${OUTLINE_MINIO_ADMIN_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: ${OUTLINE_MINIO_CONSOLE_URL}
    networks:
      - outline-network
      - traefik-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # Match incoming requests on a specific hostname
      - "traefik.http.routers.minio-api.rule=Host(`${OUTLINE_MINIO_HOSTNAME}`)"
      # Assign the router to a named Traefik service
      - "traefik.http.routers.minio-api.service=minio-api"
      # Use the 'websecure' (HTTPS) entry point
      - "traefik.http.routers.minio-api.entrypoints=websecure"
      # Define the internal container port for routing
      - "traefik.http.services.minio-api.loadbalancer.server.port=9000"
      # Enable TLS on this router
      - "traefik.http.routers.minio-api.tls=true"
      # Use Let's Encrypt for certificate management
      - "traefik.http.routers.minio-api.tls.certresolver=letsencrypt"
      # Pass the original Host header to the container
      - "traefik.http.services.minio-api.loadbalancer.passhostheader=true"
      # Apply a compression middleware
      - "traefik.http.routers.minio-api.middlewares=compresstraefik"
      # Match incoming requests on a specific hostname
      - "traefik.http.routers.minio-console.rule=Host(`${OUTLINE_MINIO_CONSOLE_HOSTNAME}`)"
      # Assign the router to a named Traefik service
      - "traefik.http.routers.minio-console.service=minio-console"
      # Use the 'websecure' (HTTPS) entry point
      - "traefik.http.routers.minio-console.entrypoints=websecure"
      # Define the internal container port for routing
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"
      # Enable TLS on this router
      - "traefik.http.routers.minio-console.tls=true"
      # Use Let's Encrypt for certificate management
      - "traefik.http.routers.minio-console.tls.certresolver=letsencrypt"
      # Pass the original Host header to the container
      - "traefik.http.services.minio-console.loadbalancer.passhostheader=true"
      # Apply a compression middleware
      - "traefik.http.routers.minio-console.middlewares=compresstraefik"
      # Define settings for the compression middleware
      - "traefik.http.middlewares.compresstraefik.compress=true"
      # Specify which Docker network Traefik should use for routing
      - "traefik.docker.network=traefik-network"
    restart: unless-stopped

  outline:
    image: *outline-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Resource limits as .env-overridable defaults (e.g. OUTLINE_KEYCLOAK_OUTLINE_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${OUTLINE_KEYCLOAK_OUTLINE_MEMORY_LIMIT:-1g}
          cpus: "${OUTLINE_KEYCLOAK_OUTLINE_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${OUTLINE_KEYCLOAK_OUTLINE_MEMORY_RESERVATION:-128m}
          cpus: "${OUTLINE_KEYCLOAK_OUTLINE_CPU_RESERVATION:-0.25}"
    environment:
      DATABASE_URL: postgres://${OUTLINE_DB_USER:-outlinedbuser}:${OUTLINE_DB_PASSWORD}@postgres-outline:5432/${OUTLINE_DB_NAME:-outlinedb}?sslmode=disable&connect_timeout=10
      PGSSLMODE: disable
      REDIS_URL: redis://redis:6379
      URL: ${OUTLINE_URL:?set in .env - see .env.example}
      PORT: 3000
      SECRET_KEY: ${OUTLINE_SECRET_KEY:?set in .env - see .env.example for generation command}
      UTILS_SECRET: ${OUTLINE_UTILS_SECRET:?set in .env - see .env.example for generation command}
      FORCE_HTTPS: 'false'
      ENABLE_UPDATES: 'true'
      AWS_REGION: eu-east-1
      AWS_ACCESS_KEY_ID: ${OUTLINE_MINIO_USER:-bucket.data}
      AWS_SECRET_ACCESS_KEY: ${OUTLINE_MINIO_USER_PASSWORD}
      AWS_S3_UPLOAD_BUCKET_URL: ${OUTLINE_AWS_S3_UPLOAD_BUCKET_URL}
      AWS_S3_ACCELERATE_URL: ${OUTLINE_AWS_S3_UPLOAD_BUCKET_URL}
      AWS_S3_UPLOAD_BUCKET_NAME: ${OUTLINE_MINIO_BUCKET_NAME:-data}
      AWS_S3_UPLOAD_MAX_SIZE: ${OUTLINE_AWS_S3_UPLOAD_MAX_SIZE}
      AWS_S3_FORCE_PATH_STYLE: 'false'
      AWS_S3_ACL: private
      OIDC_CLIENT_ID: outline
      OIDC_CLIENT_SECRET: ${OUTLINE_OIDC_CLIENT_SECRET:?set in .env - see .env.example}
      OIDC_AUTH_URI: ${OUTLINE_OIDC_AUTH_URI}
      OIDC_TOKEN_URI: ${OUTLINE_OIDC_TOKEN_URI}
      OIDC_USERINFO_URI: ${OUTLINE_OIDC_USERINFO_URI}
      OIDC_DISPLAY_NAME: ${OUTLINE_OIDC_DISPLAY_NAME:-Keycloak}
      OIDC_USERNAME_CLAIM: ${OUTLINE_OIDC_USERNAME_CLAIM:-email}
      OIDC_SCOPES: ${OUTLINE_OIDC_SCOPES:-openid profile email}
    networks:
      - outline-network
      - keycloak-network
      - traefik-network
    healthcheck:
      test: timeout 10s bash -c ':> /dev/tcp/127.0.0.1/3000' || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # Match incoming requests on a specific hostname
      - "traefik.http.routers.outline.rule=Host(`${OUTLINE_HOSTNAME:?set in .env - see .env.example}`)"
      # Assign the router to a named Traefik service
      - "traefik.http.routers.outline.service=outline"
      # Use the 'websecure' (HTTPS) entry point
      - "traefik.http.routers.outline.entrypoints=websecure"
      # Define the internal container port for routing
      - "traefik.http.services.outline.loadbalancer.server.port=3000"
      # Enable TLS on this router
      - "traefik.http.routers.outline.tls=true"
      # Use Let's Encrypt for certificate management
      - "traefik.http.routers.outline.tls.certresolver=letsencrypt"
      # Pass the original Host header to the container
      - "traefik.http.services.outline.loadbalancer.passhostheader=true"
      # Apply a compression middleware
      - "traefik.http.routers.outline.middlewares=compresstraefik"
      # Define settings for the compression middleware
      - "traefik.http.middlewares.compresstraefik.compress=true"
      # Specify which Docker network Traefik should use for routing
      - "traefik.docker.network=traefik-network"
    restart: unless-stopped
    depends_on:
      postgres-outline:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  backups-outline:
    image: *outline-postgres-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's
    # entrypoint needs (bind :80/:443, chown its data directory, drop to
    # its service user).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    # Resource limits as .env-overridable defaults (e.g. OUTLINE_KEYCLOAK_BACKUPS_OUTLINE_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${OUTLINE_KEYCLOAK_BACKUPS_OUTLINE_MEMORY_LIMIT:-256m}
          cpus: "${OUTLINE_KEYCLOAK_BACKUPS_OUTLINE_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${OUTLINE_KEYCLOAK_BACKUPS_OUTLINE_MEMORY_RESERVATION:-32m}
          cpus: "${OUTLINE_KEYCLOAK_BACKUPS_OUTLINE_CPU_RESERVATION:-0.1}"
    command: >-
      bash -c 'set -o pipefail;
      sleep "$$OUTLINE_BACKUP_INIT_SLEEP";
      while true; do
        STAMP="$$(date +%Y-%m-%d_%H-%M)";
        DB_FILE="$$OUTLINE_POSTGRES_BACKUPS_PATH/$$OUTLINE_POSTGRES_BACKUP_NAME-$$STAMP.gz";
        echo "[$$(date -Iseconds)] Starting database backup to $$DB_FILE";
        if pg_dump -h postgres-outline -p 5432 -d $$OUTLINE_DB_NAME -U $$OUTLINE_DB_USER | gzip > "$$DB_FILE"; then
          echo "[$$(date -Iseconds)] Database backup OK: $$DB_FILE ($$(stat -c %s "$$DB_FILE") bytes)";
        else
          echo "[$$(date -Iseconds)] Database backup FAILED - partial file kept as $$DB_FILE.failed for diagnosis" >&2;
          mv "$$DB_FILE" "$$DB_FILE.failed" 2>/dev/null || true;
        fi;
        DATA_FILE="$$OUTLINE_DATA_BACKUPS_PATH/$$OUTLINE_DATA_BACKUP_NAME-$$STAMP.tar.gz";
        echo "[$$(date -Iseconds)] Starting data backup to $$DATA_FILE";
        # GNU tar exits 1 when a live application changed a file mid-read;
        # the archive is complete - only exit 2 is a real failure. No GNU-only
        # flags: alpine images ship BusyBox tar.
        tar -zcpf "$$DATA_FILE" $$OUTLINE_DATA_PATH; RC=$$?;
        if [ "$$RC" -eq 0 ] || [ "$$RC" -eq 1 ]; then
          echo "[$$(date -Iseconds)] Data backup OK: $$DATA_FILE ($$(stat -c %s "$$DATA_FILE") bytes)$$([ "$$RC" -eq 1 ] && echo " - some files changed while being read")";
        else
          echo "[$$(date -Iseconds)] Data backup FAILED - partial file kept as $$DATA_FILE.failed for diagnosis" >&2;
          mv "$$DATA_FILE" "$$DATA_FILE.failed" 2>/dev/null || true;
        fi;
        if [ "$${OUTLINE_POSTGRES_BACKUP_PRUNE_DAYS:-0}" -ge 1 ]; then
          find "$$OUTLINE_POSTGRES_BACKUPS_PATH" -type f -name "$$OUTLINE_POSTGRES_BACKUP_NAME-*" -mtime "+$$OUTLINE_POSTGRES_BACKUP_PRUNE_DAYS" -delete;
        fi;
        if [ "$${OUTLINE_DATA_BACKUP_PRUNE_DAYS:-0}" -ge 1 ]; then
          find "$$OUTLINE_DATA_BACKUPS_PATH" -type f -name "$$OUTLINE_DATA_BACKUP_NAME-*" -mtime "+$$OUTLINE_DATA_BACKUP_PRUNE_DAYS" -delete;
        fi;
        sleep "$$OUTLINE_BACKUP_INTERVAL";
      done'
    volumes:
      - outline-postgres-backup:/var/lib/postgresql/data
      - minio-data:${OUTLINE_DATA_PATH:-/data}
      - outline-data-backups:${OUTLINE_DATA_BACKUPS_PATH:-/srv/outline-application-data/backups}
      - outline-database-backups:${OUTLINE_POSTGRES_BACKUPS_PATH:-/srv/outline-postgres/backups}
    environment:
      OUTLINE_DB_NAME: ${OUTLINE_DB_NAME:-outlinedb}
      OUTLINE_DB_USER: ${OUTLINE_DB_USER:-outlinedbuser}
      PGPASSWORD: ${OUTLINE_DB_PASSWORD}
      OUTLINE_BACKUP_INIT_SLEEP: ${OUTLINE_BACKUP_INIT_SLEEP:-30m}
      OUTLINE_BACKUP_INTERVAL: ${OUTLINE_BACKUP_INTERVAL:-24h}
      OUTLINE_POSTGRES_BACKUP_PRUNE_DAYS: ${OUTLINE_POSTGRES_BACKUP_PRUNE_DAYS:-7}
      OUTLINE_DATA_BACKUP_PRUNE_DAYS: ${OUTLINE_DATA_BACKUP_PRUNE_DAYS:-7}
      OUTLINE_POSTGRES_BACKUPS_PATH: ${OUTLINE_POSTGRES_BACKUPS_PATH:-/srv/outline-postgres/backups}
      OUTLINE_DATA_BACKUPS_PATH: ${OUTLINE_DATA_BACKUPS_PATH:-/srv/outline-application-data/backups}
      OUTLINE_DATA_PATH: ${OUTLINE_DATA_PATH:-/data}
      OUTLINE_POSTGRES_BACKUP_NAME: ${OUTLINE_POSTGRES_BACKUP_NAME:-outline-postgres-backup}
      OUTLINE_DATA_BACKUP_NAME: ${OUTLINE_DATA_BACKUP_NAME:-outline-minio-application-data-backup}
    networks:
      - outline-network
    restart: unless-stopped
    depends_on:
      postgres-outline:
        condition: service_healthy
