name: Deployment Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Daily rebuild: security patches should not wait for a weekly slot.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: deployment-verification-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Authenticated requests avoid the anonymous API rate limit that shared
  # GitHub runners regularly hit (api.github.com answers 403 otherwise).
  GH_API_TOKEN: ${{ github.token }}

jobs:
  lint:
    name: Lint shell scripts and workflow YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            koalaman/shellcheck-alpine:stable \
            shellcheck ./*.sh

      - name: actionlint (GitHub Actions workflow linting)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            rhysd/actionlint:1.7.12 \
            -color

  scan-trivy:
    name: Scan pinned upstream image with Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Findings surface in the Security tab for triage; they don't block CI.
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    strategy:
      # Image refs are read from each compose file's x-images defaults at
      # runtime — the compose files are the single source of truth.
      fail-fast: false
      matrix:
        include:
          - name: traefik
            env_var: TRAEFIK_IMAGE_TAG
            file: 01-traefik-outline-letsencrypt-docker-compose.yml
          - name: postgres
            env_var: KEYCLOAK_POSTGRES_IMAGE_TAG
            file: 02-keycloak-outline-docker-compose.yml
            skip_files: "usr/local/bin/gosu,/usr/local/bin/gosu,etc/ssl/private/ssl-cert-snakeoil.key,/etc/ssl/private/ssl-cert-snakeoil.key"
          - name: keycloak
            env_var: KEYCLOAK_IMAGE_TAG
            file: 02-keycloak-outline-docker-compose.yml
          - name: outline
            env_var: OUTLINE_IMAGE_TAG
            file: 03-outline-garage-redis-docker-compose.yml
          - name: redis
            env_var: OUTLINE_REDIS_IMAGE_TAG
            file: 03-outline-garage-redis-docker-compose.yml
          - name: garage
            env_var: OUTLINE_GARAGE_IMAGE_TAG
          - name: backups
            env_var: OUTLINE_BACKUPS_IMAGE_TAG
            file: 03-outline-garage-redis-docker-compose.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned ${{ matrix.name }} image from ${{ matrix.file }}
        id: pin
        env:
          ENV_VAR: ${{ matrix.env_var }}
          PIN_FILE: ${{ matrix.file }}
        run: |
          image="$(grep -m1 -oE "\\\$\\{${ENV_VAR}:-.*" "$PIN_FILE" | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
          if [ -z "$image" ]; then
            echo "${ENV_VAR} default not found in ${PIN_FILE}" >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Trivy scan of ${{ matrix.name }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.pin.outputs.image }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-files: ${{ matrix.skip_files }}

      - name: Upload Trivy SARIF (${{ matrix.name }}) to GitHub Security
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

  check-pin-freshness:
    name: Check pinned images for upstream drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Scheduled + manual dispatch only: a new upstream release is not
    # actionable inside an unrelated PR. On the cron the failure lands as a
    # workflow-failure notification to the maintainer — a stale pin must
    # not sit unnoticed. Dependabot cannot see these pins (they are compose
    # interpolation defaults, not Dockerfile literals), so this job is the
    # actual tracking mechanism.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare pinned digests against what each tag resolves to now
        run: |
          status=0
          check_digest() {
            var="$1"; file="$2"
            pin="$(grep -m1 -oE "\\\$\\{${var}:-.*" "$file" | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
            ref="${pin%%@*}"
            pinned_digest="${pin##*@}"
            # Three attempts: an unanswered registry lookup used to leave this empty,
            # and the comparison below then reported it as drift.
            current_digest=""
            for attempt in 1 2 3; do
              current_digest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty')"
              [ -n "$current_digest" ] && break
              sleep $(( attempt * 5 ))
            done
            if [ -z "$current_digest" ]; then
              echo "::error::${ref} did not resolve after three attempts: the registry did not answer, or the tag is gone. The pin itself is unchanged."
              status=1
              return
            fi
            if [ "$pinned_digest" != "$current_digest" ]; then
              echo "::error::${var} digest drift: pinned ${pinned_digest}, but ${ref} now resolves to ${current_digest}"
              status=1
            else
              echo "${var} OK (${ref})"
            fi
          }
          check_digest TRAEFIK_IMAGE_TAG 01-traefik-outline-letsencrypt-docker-compose.yml
          check_digest KEYCLOAK_POSTGRES_IMAGE_TAG 02-keycloak-outline-docker-compose.yml
          check_digest KEYCLOAK_IMAGE_TAG 02-keycloak-outline-docker-compose.yml
          check_digest OUTLINE_POSTGRES_IMAGE_TAG 03-outline-garage-redis-docker-compose.yml
          check_digest OUTLINE_IMAGE_TAG 03-outline-garage-redis-docker-compose.yml
          check_digest OUTLINE_REDIS_IMAGE_TAG 03-outline-garage-redis-docker-compose.yml
          check_digest OUTLINE_GARAGE_IMAGE_TAG 03-outline-garage-redis-docker-compose.yml
          check_digest OUTLINE_BACKUPS_IMAGE_TAG 03-outline-garage-redis-docker-compose.yml
          exit "$status"

      - name: Compare pinned app versions against the latest releases
        # Runs even when the digest comparison above failed, so one run
        # reports every problem it can see instead of one per day.
        if: always()
        run: |
          status=0
          check_gh() {
            var="$1"; file="$2"; gh_repo="$3"
            pin="$(grep -m1 -oE "\\\$\\{${var}:-.*" "$file" | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
            ref="${pin%%@*}"
            pinned_version="${ref##*:}"
            latest="$(curl -fsSL --retry 3 "https://api.github.com/repos/${gh_repo}/releases/latest" | jq -r .tag_name)"
            latest="${latest#v}"
            if [ -z "$latest" ] || [ "$latest" = "null" ]; then
              echo "::error::Could not determine the latest ${gh_repo} release"
              status=1
            elif [ "$pinned_version" != "$latest" ]; then
              echo "::error::${var} is behind: pinned ${pinned_version}, latest ${gh_repo} release is ${latest}"
              status=1
            else
              echo "${var} ${pinned_version} matches the latest ${gh_repo} release"
            fi
          }
          check_gh KEYCLOAK_IMAGE_TAG 02-keycloak-outline-docker-compose.yml keycloak/keycloak
          check_gh OUTLINE_IMAGE_TAG 03-outline-garage-redis-docker-compose.yml outline/outline
          pin="$(grep -m1 -oE '\$\{TRAEFIK_IMAGE_TAG:-.*' 01-traefik-outline-letsencrypt-docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
          ref="${pin%%@*}"; pinned_minor="${ref##*:}"
          latest="$(curl -fsSL --retry 3 -H "Authorization: Bearer $GH_API_TOKEN" https://api.github.com/repos/traefik/traefik/releases/latest | jq -r .tag_name)"; latest="${latest#v}"
          case "$latest" in
            "$pinned_minor".*) echo "Traefik pin ${pinned_minor} matches the latest release line (${latest})" ;;
            *) echo "::error::Traefik pin is behind: pinned minor ${pinned_minor}, latest release is ${latest}"; status=1 ;;
          esac
          exit "$status"

  deploy-and-test:
    name: docker compose up x3 + Keycloak/Garage/Outline smoke, and the MinIO migration
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 40
    permissions:
      contents: read

    env:
      APP_HOSTNAME: outline.heyvaldemar.net
      KEYCLOAK_HOST: keycloak.outline.heyvaldemar.net
      S3_HOST: s3.outline.heyvaldemar.net
      APP_TRAEFIK_HOSTNAME: traefik.outline.heyvaldemar.net

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create the Docker networks
        run: |
          docker network create traefik-network || true
          docker network create keycloak-network || true
          docker network create outline-network || true

      - name: Generate test .env with ephemeral credentials
        # No *_IMAGE_TAG values on purpose: the compose x-images defaults
        # apply, so CI tests exactly the pins the template ships. The OIDC
        # client secret is a placeholder — Outline boots and serves its
        # login page without a live realm; a real deployment configures the
        # realm per the README.
        run: |
          cat > .env <<EOF
          TRAEFIK_ACME_EMAIL=ci@example.com
          TRAEFIK_HOSTNAME=${APP_TRAEFIK_HOSTNAME}
          TRAEFIK_BASIC_AUTH=traefikadmin:\$\$2y\$\$10\$\$sMzJfirKC75x/hVpiINeZOiSm.Jkity9cn4KwNkRvO7hSQVFc5FLO
          KEYCLOAK_DB_PASSWORD=$(openssl rand -base64 24 | tr -d '/+=' | head -c 32)
          KEYCLOAK_ADMIN_PASSWORD=$(openssl rand -base64 24 | tr -d '/+=' | head -c 32)
          KEYCLOAK_HOSTNAME=${KEYCLOAK_HOST}
          OUTLINE_DB_PASSWORD=$(openssl rand -base64 24 | tr -d '/+=' | head -c 32)
          OUTLINE_SECRET_KEY=$(openssl rand -hex 32)
          OUTLINE_UTILS_SECRET=$(openssl rand -hex 32)
          OUTLINE_MINIO_ADMIN_PASSWORD=$(openssl rand -base64 24 | tr -d '/+=' | head -c 32)
          OUTLINE_OIDC_CLIENT_SECRET=ci-placeholder-secret
          OUTLINE_HOSTNAME=${APP_HOSTNAME}
          OUTLINE_URL=https://${APP_HOSTNAME}
          OUTLINE_S3_HOSTNAME=${S3_HOST}
          OUTLINE_S3_ACCESS_KEY=GK$(openssl rand -hex 12)
          OUTLINE_S3_SECRET_KEY=$(openssl rand -hex 32)
          OUTLINE_GARAGE_RPC_SECRET=$(openssl rand -hex 32)
          OUTLINE_GARAGE_ADMIN_TOKEN=$(openssl rand -hex 32)
          OUTLINE_OIDC_AUTH_URI=https://${KEYCLOAK_HOST}/realms/outline/protocol/openid-connect/auth
          OUTLINE_OIDC_TOKEN_URI=https://${KEYCLOAK_HOST}/realms/outline/protocol/openid-connect/token
          OUTLINE_OIDC_USERINFO_URI=https://${KEYCLOAK_HOST}/realms/outline/protocol/openid-connect/userinfo
          KEYCLOAK_BACKUP_INIT_SLEEP=15s
          KEYCLOAK_BACKUP_INTERVAL=60s
          OUTLINE_BACKUP_INIT_SLEEP=15s
          OUTLINE_BACKUP_INTERVAL=60s
          EOF
          echo "Generated ephemeral .env for CI run"

      - name: Modify /etc/hosts for internal routing
        run: |
          for h in "$APP_HOSTNAME" "$KEYCLOAK_HOST" "$S3_HOST" "$APP_TRAEFIK_HOSTNAME"; do
            echo "127.0.0.1 $h" | sudo tee -a /etc/hosts
          done

      - name: Upgrade drill — the previous release comes up first, on the volumes this run will upgrade
        # Three compose files, one project. The previous release's three files
        # are started in the same order the steps below use, every container
        # is waited healthy, the stacks are stopped and the volumes kept; the
        # ordinary starts below then recreate the changed containers on top,
        # which is what git pull and docker compose up -d do on a deployed
        # host. Every smoke check after judges the upgraded stacks.
        run: |
          files="01-traefik-outline-letsencrypt-docker-compose.yml 02-keycloak-outline-docker-compose.yml 03-outline-garage-redis-docker-compose.yml"
          prev="$(git ls-remote --tags --sort=-v:refname origin 'v*' | grep -v '\^{}' | head -1 | sed 's|.*refs/tags/||')"
          if [ -z "$prev" ]; then echo "no previous release: nothing to upgrade from"; exit 0; fi
          git fetch --depth=1 --quiet origin "refs/tags/$prev:refs/tags/$prev"
          # shellcheck disable=SC2086
          if git diff --quiet "$prev" -- $files; then echo "the compose files are unchanged since $prev: nothing to drill"; exit 0; fi
          args=""
          for f in $files; do git show "$prev:$f" > ".drill-$f"; args="$args -f .drill-$f"; done
          echo "starting $prev on this project's volumes"
          for f in $files; do docker compose -f ".drill-$f" -p outline up -d; done
          bad=""
          for _ in $(seq 1 60); do
            # shellcheck disable=SC2086
            bad="$(docker compose $args -p outline ps -a --format json \
              | jq -rs '[.[] | select((.State == "running" and (.Health == "" or .Health == "healthy")) or (.State == "exited" and .ExitCode == 0) | not)] | map("\(.Service):\(.State)/\(.Health)") | join(" ")')"
            [ -z "$bad" ] && break
            sleep 10
          done
          if [ -n "$bad" ]; then
            echo "::error::the previous release ($prev) did not come up with this run's .env: $bad"
            # shellcheck disable=SC2086
            docker compose $args -p outline logs --tail 80
            exit 1
          fi
          echo "$prev is up and healthy; stopping it and keeping its volumes"
          for f in 03-outline-garage-redis-docker-compose.yml 02-keycloak-outline-docker-compose.yml 01-traefik-outline-letsencrypt-docker-compose.yml; do docker compose -f ".drill-$f" -p outline down; done
          rm -f .drill-*.yml
          echo "the starts below are now an upgrade from $prev"

      - name: Start Traefik (file 01)
        run: docker compose -f 01-traefik-outline-letsencrypt-docker-compose.yml -p outline up -d

      - name: Start Keycloak (file 02)
        run: docker compose -f 02-keycloak-outline-docker-compose.yml -p outline up -d

      - name: Start Outline + Garage + Redis (file 03)
        run: docker compose -f 03-outline-garage-redis-docker-compose.yml -p outline up -d

      - name: Wait for Keycloak to report healthy
        run: |
          # shellcheck disable=SC2016
          timeout 10m bash -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" "$(docker compose -f 02-keycloak-outline-docker-compose.yml -p outline ps -q keycloak)")" = "healthy" ]; do
            echo "Keycloak still starting..."
            sleep 10
          done'
          echo "Keycloak healthy"

      - name: Garage is bootstrapped, and every S3 operation Outline needs works
        # The assertion behind the storage swap. Outline uploads through a
        # PRESIGNED POST by default, serves attachments through presigned GET,
        # and uses multipart for large files - so "it speaks S3" is not the
        # claim worth checking. Each of those is exercised here, through
        # Traefik, with the credentials the init container imported.
        #
        # Through Traefik on purpose: a SigV4 signature covers the Host header,
        # so a proxy that rewrote it would invalidate every presigned URL
        # Outline hands a browser. That is what passhostheader is for, and this
        # is what would notice if it were ever removed.
        run: |
          dc3() { docker compose -f 03-outline-garage-redis-docker-compose.yml -p "$COMPOSE_PROJECT_NAME" "$@"; }
          dc3 logs garage-init
          [ "$(docker inspect "$(dc3 ps -aq garage-init)" --format '{{.State.ExitCode}}')" = "0" ] \
            || { echo "::error::the Garage bootstrap did not succeed"; exit 1; }

          # shellcheck disable=SC2016
          set -a; . ./.env; set +a
          python3 -m pip install --quiet boto3
          S3_HOST="$S3_HOST" \
          AK="$OUTLINE_S3_ACCESS_KEY" SK="$OUTLINE_S3_SECRET_KEY" \
          BUCKET="${OUTLINE_S3_BUCKET_NAME:-data}" python3 tests/s3-contract.py

      - name: The MinIO migration moves real objects into Garage
        # An upgrade from 1.x leaves every attachment in the old MinIO volume,
        # and a storage swap without a proven migration is a storage swap that
        # loses files. So this creates the old volume, fills it through a real
        # MinIO, runs the shipped migration script, and reads the objects back
        # out of Garage.
        run: |
          set -a; . ./.env; set +a
          vol="${COMPOSE_PROJECT_NAME}_minio-data"
          docker volume create "$vol" > /dev/null
          docker run -d --name ci-old-minio --network outline-network \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD="$OUTLINE_MINIO_ADMIN_PASSWORD" \
            -v "$vol:/data" minio/minio:RELEASE.2025-09-07T16-13-09Z server /data > /dev/null
          # shellcheck disable=SC2016
          timeout 3m bash -c 'until docker run --rm --network outline-network minio/minio:RELEASE.2025-09-07T16-13-09Z \
            sh -c "curl -fsS http://ci-old-minio:9000/minio/health/live" >/dev/null 2>&1; do sleep 3; done'
          docker run --rm --network outline-network --entrypoint sh \
            -e P="$OUTLINE_MINIO_ADMIN_PASSWORD" minio/minio:RELEASE.2025-09-07T16-13-09Z -c '
              mc alias set old http://ci-old-minio:9000 minioadmin "$P" > /dev/null
              mc mb old/data > /dev/null 2>&1 || true
              echo "written under MinIO before the upgrade" | mc pipe old/data/uploads/legacy.txt
              head -c 300000 /dev/urandom | mc pipe old/data/uploads/legacy-big.bin'
          docker rm -f ci-old-minio > /dev/null

          chmod +x outline-minio-to-garage.sh
          ./outline-minio-to-garage.sh

          S3_HOST="$S3_HOST" AK="$OUTLINE_S3_ACCESS_KEY" SK="$OUTLINE_S3_SECRET_KEY" \
          BUCKET="${OUTLINE_S3_BUCKET_NAME:-data}" python3 tests/s3-migrated.py

      - name: Verify Outline serves its login page through Traefik
        # Outline boots and serves the login page (with the Keycloak
        # provider button) without a live realm — this proves the whole
        # chain: Traefik routing, Outline, Postgres, Redis, MinIO wiring.
        run: |
          # shellcheck disable=SC2016
          timeout 10m bash -c 'while ! curl -skL "https://$APP_HOSTNAME/" -o /dev/null -w "%{http_code}" | grep -qE "200|302"; do
            echo "Waiting for Outline..."
            sleep 10
          done'
          curl -skL "https://$APP_HOSTNAME/" -o /dev/null -w "Outline front page: %{http_code}\n"

      - name: Verify a backup is produced and valid (backups-keycloak)
        # Log-driven: the file named in a 'backup OK' line is complete by
        # definition, so this never races a dump that is still being written.
        run: |
          # shellcheck disable=SC2016
          timeout 6m bash -c 'until docker compose -f 02-keycloak-outline-docker-compose.yml -p outline logs backups-keycloak 2>/dev/null | grep -q "Database backup OK"; do echo "Waiting for the first backup cycle..."; sleep 10; done'
          db=$(docker compose -f 02-keycloak-outline-docker-compose.yml -p outline logs backups-keycloak 2>/dev/null | grep "Database backup OK" | tail -1 | sed -E 's/.*Database backup OK: ([^ ]+) .*/\1/')
          echo "Database backup file: $db"
          docker compose -f 02-keycloak-outline-docker-compose.yml -p outline exec -T backups-keycloak sh -c "gunzip -t '$db' && gunzip -c '$db' | head -5 | grep -qE 'PostgreSQL database dump'" && echo "Database backup valid: $db"
          docker compose -f 02-keycloak-outline-docker-compose.yml -p outline logs backups-keycloak 2>/dev/null | grep -i "backup FAILED" && { echo "::error::the backups log reports a failure"; exit 1; } || true

      - name: Verify a backup is produced and valid (backups-outline)
        # Log-driven: the file named in a 'backup OK' line is complete by
        # definition, so this never races a dump that is still being written.
        run: |
          # shellcheck disable=SC2016
          timeout 6m bash -c 'until docker compose -f 03-outline-garage-redis-docker-compose.yml -p outline logs backups-outline 2>/dev/null | grep -q "Database backup OK"; do echo "Waiting for the first backup cycle..."; sleep 10; done'
          db=$(docker compose -f 03-outline-garage-redis-docker-compose.yml -p outline logs backups-outline 2>/dev/null | grep "Database backup OK" | tail -1 | sed -E 's/.*Database backup OK: ([^ ]+) .*/\1/')
          echo "Database backup file: $db"
          docker compose -f 03-outline-garage-redis-docker-compose.yml -p outline exec -T backups-outline sh -c "gunzip -t '$db' && gunzip -c '$db' | head -5 | grep -qE 'PostgreSQL database dump'" && echo "Database backup valid: $db"
          # shellcheck disable=SC2016
          timeout 6m bash -c 'until docker compose -f 03-outline-garage-redis-docker-compose.yml -p outline logs backups-outline 2>/dev/null | grep -qE "Data backup (OK|FAILED)"; do echo "Waiting for the data archive..."; sleep 10; done'
          data=$(docker compose -f 03-outline-garage-redis-docker-compose.yml -p outline logs backups-outline 2>/dev/null | grep "Data backup OK" | tail -1 | sed -E 's/.*Data backup OK: ([^ ]+) .*/\1/')
          [ -n "$data" ] || { echo "::error::no 'Data backup OK' line - the data archive failed"; exit 1; }
          docker compose -f 03-outline-garage-redis-docker-compose.yml -p outline exec -T backups-outline sh -c "tar -tzf '$data' > /dev/null" && echo "Data backup valid: $data"
          docker compose -f 03-outline-garage-redis-docker-compose.yml -p outline logs backups-outline 2>/dev/null | grep -i "backup FAILED" && { echo "::error::the backups log reports a failure"; exit 1; } || true

      - name: Run the backup/restore end-to-end tests
        env:
          COMPOSE_PROJECT_NAME: outline
        run: ./tests/e2e-backup-restore.sh

      - name: Show container logs on failure
        if: failure()
        run: |
          docker compose -f 03-outline-garage-redis-docker-compose.yml -p outline logs
          docker compose -f 02-keycloak-outline-docker-compose.yml -p outline logs

      - name: Shutdown all stacks
        if: always()
        run: |
          docker compose -f 03-outline-garage-redis-docker-compose.yml -p outline down
          docker compose -f 02-keycloak-outline-docker-compose.yml -p outline down
          docker compose -f 01-traefik-outline-letsencrypt-docker-compose.yml -p outline down
