      - name: Modify /etc/hosts for internal routing
        run: |
          for h in "$APP_HOSTNAME" "$KEYCLOAK_HOST" "$S3_HOST" "$APP_TRAEFIK_HOSTNAME"; do
            echo "127.0.0.1 $h" | sudo tee -a /etc/hosts
          done
      - name: The files kept off the dead host
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dr-offsite
          path: dr-out

      - name: Restore on the clean machine, and time it
        run: ./tests/dr-drill.sh after

      - name: Keep the measured result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dr-result
          path: dr-result.json
          retention-days: 90
          if-no-files-found: ignore

      - name: Show container logs on failure
        if: failure()
        run: docker compose $(for f in $DOCKER_COMPOSE_FILE; do printf ' -f %s' "$f"; done) -p "$COMPOSE_PROJECT_NAME" logs --tail 200
