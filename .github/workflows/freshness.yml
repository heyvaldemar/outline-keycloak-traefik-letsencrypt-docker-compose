name: Pin Freshness

# ITS OWN WORKFLOW, SO THE BADGE MEANS WHAT A READER THINKS IT MEANS.
#
# This job used to run inside Deployment Verification, whose badge is the one
# on the README and in the catalogue. It is a designed alarm: it goes red when
# a pin falls behind upstream, and the fleet's triage moves the pin within the
# day. Measured across the fleet over fourteen days, nine red runs in ten were
# this alarm and nothing else, and a visitor cannot tell "one version behind"
# from "does not boot". The job below is unchanged; only its address moved.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Daily rebuild: security patches should not wait for a weekly slot.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: pin-freshness-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Authenticated requests avoid the anonymous API rate limit that shared
  # GitHub runners regularly hit (api.github.com answers 403 otherwise).
  GH_API_TOKEN: ${{ github.token }}

jobs:
  check-pin-freshness:
    name: Check pinned images for upstream drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Scheduled + manual dispatch only: a new upstream release is not
    # actionable inside an unrelated PR. On the cron the failure lands as a
    # workflow-failure notification to the maintainer — a stale pin must
    # not sit unnoticed. Dependabot cannot see these pins (they are compose
    # interpolation defaults, not Dockerfile literals), so this job is the
    # actual tracking mechanism.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare pinned digests against what each tag resolves to now
        run: |
          status=0
          check_digest() {
            var="$1"; file="$2"
            pin="$(grep -m1 -oE "\\\$\\{${var}:-.*" "$file" | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
            ref="${pin%%@*}"
            pinned_digest="${pin##*@}"
            # Three attempts: an unanswered registry lookup used to leave this empty,
            # and the comparison below then reported it as drift.
            current_digest=""
            for attempt in 1 2 3; do
              current_digest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty')"
              [ -n "$current_digest" ] && break
              sleep $(( attempt * 5 ))
            done
            if [ -z "$current_digest" ]; then
              echo "::error::${ref} did not resolve after three attempts: the registry did not answer, or the tag is gone. The pin itself is unchanged."
              status=1
              return
            fi
            if [ "$pinned_digest" != "$current_digest" ]; then
              echo "::error::${var} digest drift: pinned ${pinned_digest}, but ${ref} now resolves to ${current_digest}"
              status=1
            else
              echo "${var} OK (${ref})"
            fi
          }
          check_digest TRAEFIK_IMAGE_TAG 01-traefik-outline-letsencrypt-docker-compose.yml
          check_digest KEYCLOAK_POSTGRES_IMAGE_TAG 02-keycloak-outline-docker-compose.yml
          check_digest KEYCLOAK_IMAGE_TAG 02-keycloak-outline-docker-compose.yml
          check_digest OUTLINE_POSTGRES_IMAGE_TAG 03-outline-garage-redis-docker-compose.yml
          check_digest OUTLINE_IMAGE_TAG 03-outline-garage-redis-docker-compose.yml
          check_digest OUTLINE_REDIS_IMAGE_TAG 03-outline-garage-redis-docker-compose.yml
          check_digest OUTLINE_GARAGE_IMAGE_TAG 03-outline-garage-redis-docker-compose.yml
          check_digest OUTLINE_BACKUPS_IMAGE_TAG 03-outline-garage-redis-docker-compose.yml
          exit "$status"

      - name: Compare pinned app versions against the latest releases
        # Runs even when the digest comparison above failed, so one run
        # reports every problem it can see instead of one per day.
        if: always()
        run: |
          status=0
          check_gh() {
            var="$1"; file="$2"; gh_repo="$3"
            pin="$(grep -m1 -oE "\\\$\\{${var}:-.*" "$file" | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
            ref="${pin%%@*}"
            pinned_version="${ref##*:}"
            latest="$(curl -fsSL --retry 3 "https://api.github.com/repos/${gh_repo}/releases/latest" | jq -r .tag_name)"
            latest="${latest#v}"
            if [ -z "$latest" ] || [ "$latest" = "null" ]; then
              echo "::error::Could not determine the latest ${gh_repo} release"
              status=1
            # ORDER, NOT INEQUALITY. `!=` calls any difference "behind", including
            # being ahead, and GitHub's releases/latest is the most recently
            # PUBLISHED release rather than the highest version. A project that
            # ships a maintenance release for an older branch after a newer one
            # then fails every day, asserting a direction nothing established.
            # sort -V because a string compare puts 3.10 below 3.7.
            elif [ "${pinned_version#v}" != "${latest#v}" ] \
                 && [ "$(printf '%s\n%s\n' "${pinned_version#v}" "${latest#v}" | sort -V | head -1)" = "${pinned_version#v}" ]; then
              echo "::error::${var} is behind: pinned ${pinned_version}, latest ${gh_repo} release is ${latest}"
              status=1
            elif [ "${pinned_version#v}" != "${latest#v}" ]; then
              echo "${var} ${pinned_version} is ahead of the published ${latest}, which is what a maintenance release for an older branch looks like"
            else
              echo "${var} ${pinned_version} matches the latest ${gh_repo} release"
            fi
          }
          check_gh KEYCLOAK_IMAGE_TAG 02-keycloak-outline-docker-compose.yml keycloak/keycloak
          check_gh OUTLINE_IMAGE_TAG 03-outline-garage-redis-docker-compose.yml outline/outline
          pin="$(grep -m1 -oE '\$\{TRAEFIK_IMAGE_TAG:-.*' 01-traefik-outline-letsencrypt-docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
          ref="${pin%%@*}"; pinned_minor="${ref##*:}"
          latest="$(curl -fsSL --retry 3 -H "Authorization: Bearer $GH_API_TOKEN" https://api.github.com/repos/traefik/traefik/releases/latest | jq -r .tag_name)"; latest="${latest#v}"
          case "$latest" in
            "$pinned_minor".*) echo "Traefik pin ${pinned_minor} matches the latest release line (${latest})" ;;
            *) echo "::error::Traefik pin is behind: pinned minor ${pinned_minor}, latest release is ${latest}"; status=1 ;;
          esac
          exit "$status"
